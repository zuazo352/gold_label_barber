<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOLD LABEL BARBER (EST. 1963) — Sistema Integral POS &amp; Gestión</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='96' fill='%2308090c' stroke='%23d4af37' stroke-width='6'/%3E%3Ccircle cx='100' cy='100' r='84' fill='none' stroke='%23d4af37' stroke-width='2.5'/%3E%3Cpath d='M75 55 L125 135 M125 55 L75 135' stroke='%23f3d066' stroke-width='8' stroke-linecap='round'/%3E%3Crect x='88' y='105' width='24' height='55' rx='6' fill='%23ffffff' stroke='%23d4af37' stroke-width='3'/%3E%3Cpath d='M88 120 L112 110 M88 135 L112 125 M88 150 L112 140' stroke='%23B91C1C' stroke-width='6'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #08090c;
      --surface: #111319;
      --surface-2: #181b24;
      --input: #0b0d12;
      --border: #262b38;
      --gold: #d4af37;
      --gold-hi: #f3d066;
      --gold-lo: #9c7b1c;
      --cream: #f5ebd6;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --dim: #6b7280;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --ticket-w: 80mm;
      --ticket-fs: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      overflow-x: hidden;
    }

    .serif { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.05em; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .hidden { display: none !important; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .flex-col { flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .flex-1 { flex: 1 1 0%; }
    .shrink-0 { flex-shrink: 0; }
    .min-w-0 { min-width: 0; }
    .w-full { width: 100%; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .p-2 { padding: 8px; }
    .p-3 { padding: 12px; }
    .p-4 { padding: 16px; }
    .pt-2 { padding-top: 8px; }
    .pt-3 { padding-top: 12px; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-base { font-size: 15px; }
    .text-lg { font-size: 18px; }
    .text-xl { font-size: 22px; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .uppercase { text-transform: uppercase; letter-spacing: 0.08em; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .text-gold { color: var(--gold); }
    .text-gold-hi { color: var(--gold-hi); }
    .text-muted { color: var(--muted); }
    .text-dim { color: var(--dim); }
    .text-green { color: var(--green); }
    .text-amber { color: var(--amber); }
    .text-red { color: var(--red); }

    /* =====================================================================
       1. LOGIN SCREEN (Dark Glassmorphism - Clean)
       ===================================================================== */
    #login-view {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 22%, rgba(212, 175, 55, 0.14), transparent 55%),
        radial-gradient(circle at 80% 85%, rgba(212, 175, 55, 0.06), transparent 50%),
        #08090c;
    }
    .login-card {
      width: 100%;
      max-width: 410px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 28px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .login-emblem {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      box-shadow: 0 10px 28px rgba(212, 175, 55, 0.3);
    }
    .login-field {
      width: 100%;
      background: rgba(10, 12, 17, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-field::placeholder { color: rgba(255, 255, 255, 0.42); }
    .login-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.16); }
    .btn-cream-pill {
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #f5ebd6 0%, #e8d3a3 100%);
      color: #111318;
      font-weight: 800;
      font-size: 14.5px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(245, 235, 214, 0.2);
      transition: transform 0.12s, filter 0.15s;
    }
    .btn-cream-pill:hover { filter: brightness(1.05); }
    .btn-cream-pill:active { transform: scale(0.985); }

    /* =====================================================================
       2. WORKSPACE SHELL & COLLAPSIBLE SIDEBAR WITH EDGE HANDLE TAB
       ===================================================================== */
    #app-shell {
      display: none;
      min-height: 100vh;
      width: 100%;
      position: relative;
    }
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 245px;
      background: #0c0e14;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 60;
      transform: translateX(0);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 16px 0 44px rgba(0, 0, 0, 0.78);
    }
    body.sidebar-collapsed #sidebar {
      transform: translateX(-100%);
      box-shadow: none;
    }
    #sidebar-edge-tab {
      position: absolute;
      top: 50%;
      right: -34px;
      transform: translateY(-50%);
      width: 34px;
      height: 76px;
      background: linear-gradient(180deg, #171b26 0%, #0c0e14 100%);
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-left: none;
      border-radius: 0 12px 12px 0;
      color: var(--gold-hi);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      box-shadow: 6px 0 20px rgba(0, 0, 0, 0.65);
      pointer-events: auto;
      z-index: 65;
      padding: 0;
    }
    #sidebar-edge-tab:hover {
      background: linear-gradient(135deg, var(--gold-hi), var(--gold));
      color: #08090c;
    }
    #workspace-main {
      flex: 1 1 0%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      margin-left: 245px;
      transition: margin-left 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.sidebar-collapsed #workspace-main {
      margin-left: 0;
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: #d1d5db;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-btn:hover { background: var(--surface-2); color: var(--gold-hi); }
    .nav-btn.active {
      background: linear-gradient(135deg, var(--gold-hi), var(--gold));
      color: #08090c;
      font-weight: 800;
    }

    #topbar {
      background: #0c0e14;
      border-bottom: 1px solid var(--border);
      padding: 11px 16px 11px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      #workspace-main { margin-left: 0 !important; }
      #topbar { padding-left: 28px; }
    }

    /* =====================================================================
       3. CARDS, GRIDS, FORMS, BUTTONS & TABLES
       ===================================================================== */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .card-gold {
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .subcard { background: var(--input); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-pos { grid-template-columns: 1.55fr 1fr; }
    .grid-split { grid-template-columns: 365px 1fr; }
    .grid-split-wide { grid-template-columns: 445px 1fr; }
    .grid-catalog { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    body.sidebar-collapsed .grid-catalog { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    @media (max-width: 1120px) {
      .grid-pos, .grid-split, .grid-split-wide { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .grid-catalog { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    }

    label.lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input, select, textarea {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }
    input[type="checkbox"] { width: auto; accent-color: var(--gold); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
    .btn-xs { padding: 4px 8px; font-size: 11px; border-radius: 7px; }
    .btn-gold { background: linear-gradient(135deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%); color: #08090c; }
    .btn-dark { background: var(--surface-2); border-color: var(--border); color: var(--text); }
    .btn-dark:hover { border-color: var(--gold); color: var(--gold-hi); }
    .btn-out-gold { background: rgba(212, 175, 55, 0.11); border-color: rgba(212, 175, 55, 0.45); color: var(--gold); }
    .btn-out-gold:hover { background: var(--gold); color: #08090c; }
    .btn-red { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.42); color: #fca5a5; }
    .btn-red:hover { background: var(--red); color: #fff; }
    .btn-green { background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.42); color: #6ee7b7; }
    .btn-green:hover { background: var(--green); color: #052e16; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .b-gold { background: rgba(212, 175, 55, 0.16); color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.36); }
    .b-green { background: rgba(16, 185, 129, 0.16); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.36); }
    .b-amber { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.36); }
    .b-red { background: rgba(239, 68, 68, 0.16); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.36); }
    .b-dim { background: #1e2433; color: #cbd5e1; }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      padding: 9px;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 10px 9px; border-bottom: 1px solid rgba(38, 43, 56, 0.78); vertical-align: middle; }

    .pos-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
    }
    .pos-card:hover:not(:disabled) { border-color: var(--gold); background: var(--surface-2); }
    .pos-card:disabled { opacity: 0.45; cursor: not-allowed; }
    .pos-thumb { width: 100%; height: 96px; object-fit: cover; border-radius: 8px; background: #080a0e; border: 1px solid var(--border); }
    .pos-thumb-svg {
      width: 100%;
      height: 96px;
      border-radius: 8px;
      background: linear-gradient(145deg, #0b0d13, #151924);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }

    /* =====================================================================
       4. FLOATING NUMERIC TOUCH KEYPAD
       ===================================================================== */
    #virtual-num-pad {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(20, 24, 34, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 14px;
      z-index: 9999;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
      width: 256px;
      user-select: none;
    }
    .num-pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .num-key {
      background: #1a202e;
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 12px 0;
      font-size: 17px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: background 0.1s, transform 0.08s;
    }
    .num-key:hover { border-color: var(--gold); color: var(--gold-hi); }
    .num-key:active { transform: scale(0.95); background: var(--gold); color: #08090c; }
    .num-key-fn {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.42);
      padding: 12px 0;
      font-size: 15px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }
    .num-key-fn:active { transform: scale(0.95); background: var(--red); color: #fff; }
    .num-key-ok {
      grid-column: span 3;
      background: linear-gradient(135deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%);
      color: #08090c;
      border: none;
      padding: 10px 0;
      font-size: 13.5px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
    }

    /* =====================================================================
       5. TOAST NOTIFICATIONS & DIRECT THERMAL PRINT (@media print)
       ===================================================================== */
    #toast-box {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      background: #141822;
      border: 1px solid var(--gold);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.78);
    }

    #print-area { display: none; }

    @media print {
      @page { margin: 0; }
      body { background: #ffffff !important; color: #000000 !important; }
      #login-view, #app-shell, #toast-box, #virtual-num-pad { display: none !important; }
      #print-area {
        display: block !important;
        width: var(--ticket-w, 80mm) !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 4mm !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-family: "Courier New", Courier, monospace !important;
        font-size: var(--ticket-fs, 12px) !important;
        line-height: 1.35 !important;
      }
      #print-area * { color: #000000 !important; }
    }
  </style>
</head>
<body>

  <!-- =====================================================================
       1. LOGIN SCREEN (Dark Glassmorphism - Clean, No Demo Hints/Buttons)
       ===================================================================== -->
  <section id="login-view">
    <div class="login-card">
      <div id="login-emblem" class="login-emblem"></div>
      <h1 class="serif text-xl font-extrabold text-center" style="color:#f5ebd6;">GOLD LABEL BARBER</h1>
      <p class="text-xs uppercase text-center text-gold mt-1 mb-4" style="letter-spacing:0.2em;">EST. 1963</p>

      <form data-form="login" class="flex flex-col gap-3 mt-4">
        <div>
          <label class="block text-xs font-bold mb-1" style="color:rgba(255,255,255,0.85);">Usuario</label>
          <input type="text" id="login-user" class="login-field" placeholder="Ingresa tu usuario" autocomplete="username" required />
        </div>
        <div>
          <label class="block text-xs font-bold mb-1" style="color:rgba(255,255,255,0.85);">Contraseña</label>
          <input type="password" id="login-pass" class="login-field" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div id="login-err" class="text-xs text-red text-center hidden">Usuario o contraseña incorrectos.</div>
        <button type="submit" class="btn-cream-pill mt-2">Ingresar al Sistema</button>
      </form>
    </div>
  </section>

  <!-- =====================================================================
       2. MAIN WORKSPACE SHELL (Collapsible Sidebar with Left Edge Tab)
       ===================================================================== -->
  <div id="app-shell">
    <aside id="sidebar">
      <button type="button" data-action="toggle-sidebar" id="sidebar-edge-tab" title="Ocultar / Mostrar Menú">
        <span id="edge-tab-arrow" style="font-size:13px;font-weight:900;line-height:1;">&#9664;</span>
        <span style="font-size:9px;font-weight:800;writing-mode:vertical-rl;letter-spacing:0.12em;text-transform:uppercase;">Menú</span>
      </button>

      <div class="p-3 flex items-center gap-2" style="border-bottom: 1px solid var(--border);">
        <div id="sb-logo" style="width:44px;height:44px;flex-shrink:0;"></div>
        <div class="min-w-0">
          <div class="serif text-xs font-extrabold text-gold truncate">GOLD LABEL BARBER</div>
          <div class="text-xs text-muted truncate">EST. 1963 • RD$</div>
        </div>
      </div>

      <div class="p-3" style="border-bottom: 1px solid var(--border);">
        <div class="subcard flex items-center gap-2">
          <div id="sb-avatar" class="badge b-gold font-extrabold" style="width:32px;height:32px;justify-content:center;border-radius:50%;">AG</div>
          <div class="min-w-0 flex-1">
            <div id="sb-uname" class="text-xs font-bold truncate">Administrador General</div>
            <div id="sb-urole" class="text-xs text-gold truncate">Administrador</div>
          </div>
        </div>
      </div>

      <nav id="sb-nav" class="p-3 flex flex-col gap-1 flex-1" style="overflow-y:auto;"></nav>

      <div class="p-3" style="border-top: 1px solid var(--border);">
        <button type="button" data-action="logout" class="btn btn-red btn-sm w-full">Cerrar Sesión</button>
      </div>
    </aside>

    <div id="workspace-main">
      <header id="topbar">
        <div class="flex items-center gap-3 min-w-0">
          <button type="button" data-action="toggle-sidebar" id="btn-toggle-sb" class="btn btn-dark btn-sm">&#9776; Ocultar Menú</button>
          <div class="min-w-0">
            <h2 id="mod-title" class="text-base font-extrabold truncate">Ventas (POS)</h2>
            <p id="mod-sub" class="text-xs text-muted truncate">Punto de Venta táctil y ticket térmico 80mm</p>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <span id="cloud-status-pill" class="badge b-dim">&#9729; Conectando Nube...</span>
          <span id="today-pill" class="badge b-gold"></span>
          <button type="button" data-action="logout" class="btn btn-red btn-sm">Cerrar Sesión</button>
        </div>

    function compressImageFile(fileInput, callback) {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var max = 240;
          var w = img.width;
          var h = img.height;
          if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
          else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

      if (posTab === 'todos' || posTab === 'productos') {
        state.products.filter(function (p) {
          var matchCat = posTab !== 'productos' || posCategory === 'todas' || p.categoryId === posCategory;
          var matchQ = !q || p.nombre.toLowerCase().indexOf(q) !== -1;
          return matchCat && matchQ;
        }).forEach(function (p) {
          var catObj = state.productCategories.find(function (c) { return c.id === p.categoryId; });
          var out = p.stock <= 0;
          var stBadge = out ? 'b-red' : (p.stock <= 5 ? 'b-amber' : 'b-green');
          var thumb = p.imagen
            ? '<img src="' + p.imagen + '" class="pos-thumb" onerror="this.style.display='none'"/>'
            : '<div class="pos-thumb-svg">' + placeholderIconSVG('producto') + '</div>';
          cardsHtml += '<button type="button" data-action="cart-add" data-tipo="producto" data-id="' + p.id + '" class="pos-card" ' + (out ? 'disabled' : '') + '>' +
            '<div>' + thumb +
            '<div class="flex justify-between items-center mt-2 mb-1 gap-1"><span class="badge b-dim truncate">' + esc(catObj ? catObj.nombre : 'Producto') + '</span><span class="badge ' + stBadge + '">' + (out ? 'Agotado' : 'Stock: ' + p.stock) + '</span></div>' +
            '<div class="text-sm font-bold">' + esc(p.nombre) + '</div></div>' +
            '<div class="flex justify-between items-center pt-2" style="border-top:1px solid var(--border);"><b class="text-gold">' + rd(p.precio) + '</b><span class="badge ' + (out ? 'b-red' : 'b-gold') + '">' + (out ? 'Sin Stock' : '+ Agregar') + '</span></div>' +
          '</button>';
        });
      }

      var total = posCart.reduce(function (sum, it) { return sum + (it.precio * it.cantidad); }, 0);
      var cashVal = parseFloat(posCashReceived) || 0;
      var changeVal = cashVal - total;

      var activeBarbers = state.barbers.filter(function (b) { return b.activo !== false; });
      if (!posBarberId && activeBarbers[0]) posBarberId = activeBarbers[0].id;

      root.innerHTML = '<div class="grid grid-pos">' +
        '<div class="flex flex-col gap-3">' +
          '<div class="card">' +
            '<div class="flex justify-between items-center gap-2 flex-wrap">' +
              '<div class="flex gap-1">' +
                '<button type="button" data-action="pos-tab" data-tab="todos" class="btn btn-sm ' + (posTab === 'todos' ? 'btn-gold' : 'btn-dark') + '">Todos</button>' +
                '<button type="button" data-action="pos-tab" data-tab="servicios" class="btn btn-sm ' + (posTab === 'servicios' ? 'btn-gold' : 'btn-dark') + '">Servicios</button>' +
                '<button type="button" data-action="pos-tab" data-tab="productos" class="btn btn-sm ' + (posTab === 'productos' ? 'btn-gold' : 'btn-dark') + '">Productos</button>' +
              '</div>' +
              '<input type="search" id="pos-search-inp" value="' + esc(posSearch) + '" placeholder="Buscar corte, barba o producto..." style="max-width:250px;" />' +
            '</div>' +
            catBar +
          '</div>' +
          '<div class="grid grid-catalog">' + (cardsHtml || '<div class="card text-center text-muted" style="grid-column:1/-1;">No hay artículos que coincidan con el filtro.</div>') + '</div>' +
        '</div>' +

        '<div class="card-gold flex flex-col justify-between gap-3">' +
          '<div>' +
            '<div class="flex justify-between items-center mb-3">' +
              '<h3 class="serif text-base font-extrabold text-gold">Orden Actual</h3>' +
              '<button type="button" data-action="cart-clear" class="btn btn-red btn-xs">Vaciar</button>' +
            '</div>' +
            '<div class="flex flex-col gap-2 mb-3">' +
              '<div><label class="lbl">Barbero que atiende *</label>' +
                '<select id="pos-barber">' + activeBarbers.map(function (b) {
                  return '<option value="' + b.id + '" ' + (b.id === posBarberId ? 'selected' : '') + '>' + esc(b.nombre) + '</option>';
                }).join('') + '</select>' +
              '</div>' +
              '<div class="grid grid-2 gap-2">' +
                '<div><label class="lbl">Cliente Registrado</label>' +
                  '<select id="pos-client-sel"><option value="">Cliente de paso</option>' + state.clients.map(function (c) {
                    return '<option value="' + esc(c.nombre) + '" ' + (c.nombre === posClientSel ? 'selected' : '') + '>' + esc(c.nombre) + '</option>';
                  }).join('') + '</select>' +
                '</div>' +
                '<div><label class="lbl">O Nombre Manual</label>' +
                  '<input type="text" id="pos-client-txt" value="' + esc(posClientWalkin) + '" placeholder="Ej. Juan Pérez" />' +
                '</div>' +
              '</div>' +
              '<div><label class="lbl">Método de Pago</label>' +
                '<div class="grid grid-3 gap-1">' +
                  ['Efectivo', 'Tarjeta', 'Transferencia'].map(function (m) {
                    return '<button type="button" data-action="pos-pay" data-pay="' + m + '" class="btn btn-xs ' + (posPayMethod === m ? 'btn-gold' : 'btn-dark') + '">' + m + '</button>';
                  }).join('') +
                '</div>' +
              '</div>' +
            '</div>' +

            '<div class="flex flex-col gap-2" style="max-height:240px;overflow-y:auto;">' +
              (posCart.length === 0 ? '<div class="subcard text-center text-xs text-muted p-4">Selecciona servicios o productos del catálogo para facturar.</div>' :
              posCart.map(function (it, idx) {
                return '<div class="subcard flex justify-between items-center gap-2">' +
                  '<div class="min-w-0 flex-1"><div class="text-xs font-bold truncate">' + esc(it.nombre) + '</div><div class="text-xs text-gold">' + rd(it.precio) + ' c/u</div></div>' +
                  '<div class="flex items-center gap-1 shrink-0">' +
                    '<button type="button" data-action="cart-qty" data-idx="' + idx + '" data-delta="-1" class="btn btn-dark btn-xs">-</button>' +
                    '<span class="text-xs font-bold" style="min-width:20px;text-align:center;">' + it.cantidad + '</span>' +
                    '<button type="button" data-action="cart-qty" data-idx="' + idx + '" data-delta="1" class="btn btn-dark btn-xs">+</button>' +
                    '<button type="button" data-action="cart-del" data-idx="' + idx + '" class="btn btn-red btn-xs">X</button>' +
                  '</div>' +
                '</div>';
              }).join('')) +
            '</div>' +
          '</div>' +

          '<div class="pt-3" style="border-top:1px solid var(--border);">' +
            (posPayMethod === 'Efectivo' ? '<div class="grid grid-2 gap-2 mb-2">' +
              '<div><label class="lbl">Efectivo Recibido RD$</label><input type="number" step="0.01" id="pos-cash-inp" data-numpad="Efectivo Recibido RD$" value="' + esc(posCashReceived) + '" placeholder="0.00" /></div>' +
              '<div class="subcard flex flex-col justify-center"><span class="text-xs text-muted">Devuelta / Cambio</span><b id="pos-change-lbl" class="text-sm ' + (changeVal >= 0 ? 'text-green' : 'text-amber') + '">' + (cashVal > 0 ? rd(Math.max(0, changeVal)) : 'RD$ 0.00') + '</b></div>' +
            '</div>' : '') +
            '<div class="flex justify-between items-center mb-3"><span class="text-sm font-bold text-muted">TOTAL A COBRAR</span><span class="text-xl font-extrabold text-gold-hi">' + rd(total) + '</span></div>' +
            '<button type="button" data-action="pos-checkout" class="btn btn-gold w-full" style="padding:12px;">Cobrar e Imprimir Ticket (80mm)</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    // =========================================================================
    // 5. MODULE 2: DASHBOARD
    // =========================================================================
    function renderDashboard(root) {
      var daySales = state.sales.filter(function (s) { return s.fecha === dashDate; });
      var dayAdv = state.advances.filter(function (a) { return a.fecha === dashDate; });

      var totalVendido = 0;
      var ingServicios = 0;
      var ingProductos = 0;
      var byBarber = {};

      daySales.forEach(function (s) {
        totalVendido += Number(s.total) || 0;
        byBarber[s.barberoNombre] = (byBarber[s.barberoNombre] || 0) + (Number(s.total) || 0);
        (s.items || []).forEach(function (it) {
          var sub = (Number(it.precio) || 0) * (Number(it.cantidad) || 0);
          if (it.tipo === 'producto') ingProductos += sub;
          else ingServicios += sub;
        });
      });

      var totalAdelantos = dayAdv.reduce(function (sum, a) { return sum + (Number(a.monto) || 0); }, 0);
      var efectivoNeto = totalVendido - totalAdelantos;
      var pctServ = totalVendido > 0 ? Math.round((ingServicios / totalVendido) * 100) : 0;
      var pctProd = totalVendido > 0 ? (100 - pctServ) : 0;

      var topBarbers = Object.keys(byBarber).map(function (name) {
        return { nombre: name, total: byBarber[name] };
      }).sort(function (a, b) { return b.total - a.total; });

      root.innerHTML = '<div class="flex flex-col gap-4">' +
        '<div class="card flex justify-between items-center flex-wrap gap-2">' +
          '<div><h3 class="text-base font-bold text-gold">Resumen Financiero del Día</h3><p class="text-xs text-muted">Indicadores en tiempo real en Pesos Dominicanos (RD$)</p></div>' +
          '<div class="flex items-center gap-2"><label class="lbl mb-0">Fecha:</label><input type="date" id="dash-date-inp" value="' + dashDate + '" style="width:170px;" /></div>' +
        '</div>' +

        '<div class="grid grid-4">' +
          '<div class="card-gold"><div class="text-xs uppercase text-muted font-bold">Total Vendido</div><div class="text-xl font-extrabold text-gold-hi mt-1">' + rd(totalVendido) + '</div><div class="text-xs text-muted mt-1">' + daySales.length + ' tickets emitidos</div></div>' +
          '<div class="card"><div class="text-xs uppercase text-muted font-bold">Ingresos Servicios</div><div class="text-xl font-extrabold text-green mt-1">' + rd(ingServicios) + '</div><div class="text-xs text-muted mt-1">' + pctServ + '% del total</div></div>' +
          '<div class="card"><div class="text-xs uppercase text-muted font-bold">Ingresos Productos</div><div class="text-xl font-extrabold text-gold mt-1">' + rd(ingProductos) + '</div><div class="text-xs text-muted mt-1">' + pctProd + '% del total</div></div>' +
          '<div class="card"><div class="text-xs uppercase text-muted font-bold">Adelantos / Efectivo Neto</div><div class="text-xl font-extrabold text-green mt-1">' + rd(efectivoNeto) + '</div><div class="text-xs text-amber mt-1">Adelantos: -' + rd(totalAdelantos) + '</div></div>' +
        '</div>' +

        '<div class="grid grid-2">' +
          '<div class="card">' +
            '<h4 class="text-sm font-bold text-gold mb-3">Distribución: Servicios vs Productos</h4>' +
            '<div class="mb-3"><div class="flex justify-between text-xs mb-1"><span>Servicios (' + pctServ + '%)</span><b>' + rd(ingServicios) + '</b></div>' +
            '<div style="height:12px;background:#1e2433;border-radius:999px;overflow:hidden;"><div style="height:100%;width:' + pctServ + '%;background:var(--green);"></div></div></div>' +
            '<div><div class="flex justify-between text-xs mb-1"><span>Productos (' + pctProd + '%)</span><b>' + rd(ingProductos) + '</b></div>' +
            '<div style="height:12px;background:#1e2433;border-radius:999px;overflow:hidden;"><div style="height:100%;width:' + pctProd + '%;background:var(--gold);"></div></div></div>' +
          '</div>' +

          '<div class="card">' +
            '<h4 class="text-sm font-bold text-gold mb-3">Top Barberos del Día</h4>' +
            (topBarbers.length === 0 ? '<p class="text-xs text-muted">Sin ventas registradas en esta fecha.</p>' :
            topBarbers.map(function (tb, i) {
              return '<div class="subcard flex justify-between items-center mb-2"><span class="text-xs font-bold">#' + (i + 1) + ' ' + esc(tb.nombre) + '</span><span class="badge b-gold">' + rd(tb.total) + '</span></div>';
            }).join('')) +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<h4 class="text-sm font-bold text-gold mb-3">Actividad del Día (' + dashDate + ')</h4>' +
          (daySales.length === 0 ? '<p class="text-xs text-muted">No hay movimientos registrados para esta fecha.</p>' :
          '<div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Hora</th><th>Cliente</th><th>Le Atendió</th><th>Pago</th><th class="text-right">Total</th></tr></thead><tbody>' +
          daySales.map(function (s) {
            return '<tr><td class="mono text-xs text-gold font-bold">' + esc(s.id) + '</td><td class="text-xs">' + esc(s.hora || '') + '</td><td class="text-xs font-bold">' + esc(s.clienteNombre) + '</td><td class="text-xs">' + esc(s.barberoNombre) + '</td><td><span class="badge b-dim">' + esc(s.metodoPago) + '</span></td><td class="text-right text-xs font-bold text-green">' + rd(s.total) + '</td></tr>';
          }).join('') +
          '</tbody></table></div>') +
        '</div>' +
      '</div>';
    }

    // =========================================================================
    // 6. MODULE 3: CLIENTES
    // =========================================================================
    function renderClientes(root) {
      var ed = editClientId ? state.clients.find(function (c) { return c.id === editClientId; }) : null;
      var q = clientSearch.toLowerCase().trim();
      var list = state.clients.filter(function (c) {
        return !q || c.nombre.toLowerCase().indexOf(q) !== -1 || (c.telefono || '').indexOf(q) !== -1;
      });

      root.innerHTML = '<div class="grid grid-split">' +
        '<div class="card-gold">' +
          '<h3 class="text-base font-bold text-gold mb-3">' + (ed ? 'Editar Cliente' : 'Registrar Cliente') + '</h3>' +
          '<form data-form="client" class="flex flex-col gap-3">' +
            '<div><label class="lbl">Nombre Completo *</label><input type="text" id="cl-nom" required value="' + esc(ed ? ed.nombre : '') + '" /></div>' +
            '<div><label class="lbl">Teléfono</label><input type="text" id="cl-tel" value="' + esc(ed ? ed.telefono : '') + '" placeholder="809-555-0000" /></div>' +
            '<div><label class="lbl">Notas / Corte Preferido</label><textarea id="cl-not" rows="3" placeholder="Ej. Degradado medio, navaja...">' + esc(ed ? ed.notas : '') + '</textarea></div>' +
            '<div class="flex gap-2"><button type="submit" class="btn btn-gold flex-1">Guardar Cliente</button>' +
            (ed ? '<button type="button" data-action="client-cancel" class="btn btn-dark">Cancelar</button>' : '') + '</div>' +
          '</form>' +
        '</div>' +

        '<div class="card">' +
          '<div class="flex justify-between items-center flex-wrap gap-2 mb-3">' +
            '<h3 class="text-base font-bold">Cartera de Clientes (' + state.clients.length + ')</h3>' +
            '<input type="search" id="cl-search-inp" value="' + esc(clientSearch) + '" placeholder="Buscar cliente o teléfono..." style="max-width:240px;" />' +
          '</div>' +
          '<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Visitas</th><th>Total Gastado</th><th>Preferencias</th><th class="text-right">Acciones</th></tr></thead><tbody>' +
          list.map(function (c) {
            var cSales = state.sales.filter(function (s) { return s.clienteNombre === c.nombre; });
            var spent = cSales.reduce(function (sum, s) { return sum + (Number(s.total) || 0); }, 0);
            return '<tr>' +
              '<td class="font-bold text-xs">' + esc(c.nombre) + '</td>' +
              '<td class="text-xs text-muted">' + esc(c.telefono || '-') + '</td>' +
              '<td><span class="badge b-dim">' + cSales.length + '</span></td>' +
              '<td class="text-xs font-bold text-gold">' + rd(spent) + '</td>' +
              '<td class="text-xs text-muted">' + esc(c.notas || '-') + '</td>' +
              '<td class="text-right"><button type="button" data-action="client-edit" data-id="' + c.id + '" class="btn btn-dark btn-xs">Editar</button> <button type="button" data-action="client-del" data-id="' + c.id + '" class="btn btn-red btn-xs">X</button></td>' +
            '</tr>';
          }).join('') +
          '</tbody></table></div>' +
        '</div>' +
      '</div>';
    }

    // =========================================================================
    // 7. MODULE 4: PRODUCTOS (CATEGORÍAS, IMÁGENES Y CONTROL DE STOCK)
    // =========================================================================
    function renderProductos(root) {
      var edCat = editCatId ? state.productCategories.find(function (c) { return c.id === editCatId; }) : null;
      var edProd = editProdId ? state.products.find(function (p) { return p.id === editProdId; }) : null;
      var prevImg = tempProdImg || (edProd ? (edProd.imagen || '') : '');

      root.innerHTML = '<div class="flex flex-col gap-4">' +
        '<div class="card">' +
          '<div class="flex justify-between items-center flex-wrap gap-2 mb-3">' +
            '<div><h3 class="text-sm font-bold text-gold">Categorías de Productos</h3><p class="text-xs text-muted">Crea, edita o elimina categorías para filtrar productos en Ventas POS</p></div>' +
            '<form data-form="category" class="flex gap-2 items-center">' +
              '<input type="text" id="cat-nom" required value="' + esc(edCat ? edCat.nombre : '') + '" placeholder="Nueva categoría..." style="width:210px;" />' +
              '<button type="submit" class="btn btn-gold btn-sm">' + (edCat ? 'Actualizar' : '+ Crear') + '</button>' +
              (edCat ? '<button type="button" data-action="cat-cancel" class="btn btn-dark btn-sm">Cancelar</button>' : '') +
            '</form>' +
          '</div>' +
          '<div class="flex gap-2 flex-wrap">' +
            state.productCategories.map(function (c) {
              return '<div class="subcard inline-flex items-center gap-2 p-2">' +
                '<span class="text-xs font-bold">' + esc(c.nombre) + '</span>' +
                '<button type="button" data-action="cat-edit" data-id="' + c.id + '" class="btn btn-dark btn-xs">Editar</button>' +
                '<button type="button" data-action="cat-del" data-id="' + c.id + '" class="btn btn-red btn-xs">X</button>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>' +

        '<div class="grid grid-split">' +
          '<div class="card-gold">' +
            '<h3 class="text-base font-bold text-gold mb-3">' + (edProd ? 'Editar Producto' : 'Nuevo Producto') + '</h3>' +
            '<form data-form="product" class="flex flex-col gap-2">' +
              '<div><label class="lbl">Nombre del Producto *</label><input type="text" id="pr-nom" required value="' + esc(edProd ? edProd.nombre : '') + '" /></div>' +
              '<div><label class="lbl">Categoría *</label><select id="pr-cat">' +
                state.productCategories.map(function (c) {
                  return '<option value="' + c.id + '" ' + (edProd && edProd.categoryId === c.id ? 'selected' : '') + '>' + esc(c.nombre) + '</option>';
                }).join('') +
              '</select></div>' +
              '<div class="grid grid-3 gap-2">' +
                '<div><label class="lbl">Costo RD$</label><input type="number" step="0.01" id="pr-cos" data-numpad="Costo RD$" required value="' + (edProd ? edProd.costo : 250) + '" /></div>' +
                '<div><label class="lbl">Precio RD$</label><input type="number" step="0.01" id="pr-pre" data-numpad="Precio Venta RD$" required value="' + (edProd ? edProd.precio : 650) + '" /></div>' +
                '<div><label class="lbl">Stock</label><input type="number" id="pr-stk" data-numpad="Stock Inicial" required value="' + (edProd ? edProd.stock : 10) + '" /></div>' +
              '</div>' +
              '<div class="subcard">' +
                '<label class="lbl">Imagen del Producto</label>' +
                '<div class="flex items-center gap-2">' +
                  (prevImg ? '<img src="' + prevImg + '" style="width:48px;height:48px;object-fit:cover;border-radius:8px;" />' : '<span class="badge b-gold">Sin foto</span>') +
                  '<label class="btn btn-out-gold btn-xs" style="cursor:pointer;">Subir Archivo<input type="file" id="pr-file" accept="image/*" class="hidden" /></label>' +
                  (prevImg ? '<button type="button" data-action="prod-clear-img" class="btn btn-red btn-xs">Quitar</button>' : '') +
                '</div>' +
                '<input type="url" id="pr-url" class="mt-2" value="' + (prevImg && prevImg.indexOf('data:') !== 0 ? esc(prevImg) : '') + '" placeholder="O pega una URL de imagen..." />' +
              '</div>' +
              '<div class="flex gap-2 mt-1"><button type="submit" class="btn btn-gold flex-1">Guardar Producto</button>' +
              (edProd ? '<button type="button" data-action="prod-cancel" class="btn btn-dark">Cancelar</button>' : '') + '</div>' +
            '</form>' +
          '</div>' +

          '<div class="card">' +
            '<h3 class="text-base font-bold mb-3">Inventario de Productos (' + state.products.length + ')</h3>' +
            '<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Costo / Venta</th><th>Margen</th><th>Stock</th><th>Ajuste Rápido</th><th class="text-right">Acciones</th></tr></thead><tbody>' +
            state.products.map(function (p) {
              var cat = state.productCategories.find(function (c) { return c.id === p.categoryId; });
              var profit = (Number(p.precio) || 0) - (Number(p.costo) || 0);
              var pct = p.precio > 0 ? Math.round((profit / p.precio) * 100) : 0;
              var stCls = p.stock <= 0 ? 'b-red' : (p.stock <= 5 ? 'b-amber' : 'b-green');
              var batchRow = batchProdId === p.id
                ? '<div class="flex gap-1 items-center mt-1 flex-wrap">' +
                    '<button type="button" data-action="prod-stock" data-id="' + p.id + '" data-delta="-5" class="btn btn-red btn-xs">-5</button>' +
                    '<button type="button" data-action="prod-stock" data-id="' + p.id + '" data-delta="5" class="btn btn-green btn-xs">+5</button>' +
                    '<button type="button" data-action="prod-stock" data-id="' + p.id + '" data-delta="10" class="btn btn-green btn-xs">+10</button>' +
                    '<input type="number" id="batch-inp-' + p.id + '" data-numpad="Cantidad Lote" value="15" style="width:60px;padding:3px 6px;font-size:11px;" />' +
                    '<button type="button" data-action="prod-batch-apply" data-id="' + p.id + '" class="btn btn-gold btn-xs">Aplicar</button>' +
                  '</div>'
                : '';
              return '<tr>' +
                '<td><div class="flex items-center gap-2">' + (p.imagen ? '<img src="' + p.imagen + '" style="width:36px;height:36px;object-fit:cover;border-radius:7px;" />' : '<span class="badge b-gold">PRD</span>') + '<span class="text-xs font-bold">' + esc(p.nombre) + '</span></div></td>' +
                '<td><span class="badge b-dim">' + esc(cat ? cat.nombre : '-') + '</span></td>' +
                '<td class="text-xs"><span class="text-muted">' + rd(p.costo) + '</span> / <b class="text-gold">' + rd(p.precio) + '</b></td>' +
                '<td class="text-xs text-green font-bold">' + rd(profit) + ' (' + pct + '%)</td>' +

    function directThermalPrint(innerHtml) {
      var r = state.receipt;
      document.documentElement.style.setProperty('--ticket-w', r.anchoPapel === '58mm' ? '58mm' : '80mm');
      document.documentElement.style.setProperty('--ticket-fs', r.fontSize || '12px');
      var area = document.getElementById('print-area');
      area.innerHTML = innerHtml;
      setTimeout(function () { window.print(); }, 60);
    }

    function printBarberReportDirect(barberId) {

      var r = state.receipt;
      var bSales = state.sales.filter(function (s) { return s.barberoId === b.id && s.fecha === barbRepDate; });

      var totV = 0;
      var lines = '';
      bSales.forEach(function (s) {
        totV += Number(s.total) || 0;
        (s.items || []).forEach(function (it) {
          lines += '<div style="display:flex;justify-content:space-between;font-size:0.9em;margin-bottom:3px;"><span>' + it.cantidad + 'x ' + esc(it.nombre) + '</span><b>' + rd(it.precio * it.cantidad) + '</b></div>';

      var comRD = totV * ((Number(b.comision) || 0) / 100);

      var neto = comRD - advRD;

      var html = ticketHeaderHtml('brep-pr', r) +

          '<div style="display:flex;justify-content:space-between;"><span>Total Generado:</span><b>' + rd(totV) + '</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Comisión (' + b.comision + '%):</span><b>' + rd(comRD) + '</b></div>' +

      directThermalPrint(html);

          '<div style="display:flex;justify-content:space-between;"><span>Ventas Efectivo:</span><b>' + rd(vEf) + '</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Ventas Tarjeta:</span><b>' + rd(vTar) + '</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Transferencias:</span><b>' + rd(vTra) + '</b></div>' +
          '<div style="display:flex;justify-content:space-between;border-top:1px solid #000;margin-top:4px;padding-top:4px;"><span>TOTAL VENDIDO:</span><b>' + rd(totV) + '</b></div>' +
        '</div>' +

      directThermalPrint(html);

    // =========================================================================
    // 17. FIREBASE CLOUD STATUS PILL & REAL-TIME LISTENER
    // =========================================================================
    function updateCloudPill() {
      var pill = document.getElementById('cloud-status-pill');
      if (!pill) return;
      if (db && cloudConnected) {
        pill.className = 'badge b-green';
        pill.innerHTML = '&#9729; Nube Sincronizada (' + DEFAULT_FB.projectId + ')';
      } else if (db) {
        pill.className = 'badge b-amber';
        pill.innerHTML = '&#9729; Conectando Nube...';
      } else {
        pill.className = 'badge b-dim';
        pill.innerHTML = '&#9729; Modo Local';
      }
    }

    function startRealtimeCloudSync() {
      if (!db) return;
      db.collection("gold_label_barber").doc("main_data").onSnapshot(function (doc) {
        cloudConnected = true;
        updateCloudPill();
        if (!doc.exists) {
          pushStateToFirebase();
          return;
        }
        var data = doc.data();
        if (!data || !data.payloadJson) return;
        if (data.updatedAt && data.updatedAt === lastCloudUpdatedAt) return;
        try {
          var remoteState = JSON.parse(data.payloadJson);
          isApplyingRemote = true;
          state = Object.assign(defaultState(), remoteState);
          state.receipt = Object.assign(defaultState().receipt, remoteState.receipt || {});
          state.cloud = Object.assign(defaultState().cloud, remoteState.cloud || {});
          lastCloudUpdatedAt = data.updatedAt || '';
          safeSet(STORAGE_KEY, JSON.stringify(state));
          if (currentUser) {
            renderActiveModule();
          }
          isApplyingRemote = false;
        } catch (err) {
          isApplyingRemote = false;
          console.error("Error procesando sincronización entrante:", err);
        }
      }, function (err) {
        console.error("Error en listener de Firestore:", err);
      });
    }

    // =========================================================================
    // 18. FLOATING NUMERIC TOUCH KEYPAD ENGINE
    // =========================================================================
    var activeNumberInput = null;

    function showNumPadFor(inputEl) {
      activeNumberInput = inputEl;
      var pad = document.getElementById('virtual-num-pad');
      var lbl = document.getElementById('num-pad-label');
      if (lbl) {
        lbl.textContent = inputEl.getAttribute('data-numpad') || 'Teclado Numérico';
      }
      if (pad) {
        pad.style.display = 'block';
      }
    }

    function hideNumPad() {
      var pad = document.getElementById('virtual-num-pad');
      if (pad) {
        pad.style.display = 'none';
      }
      activeNumberInput = null;
    }

    document.addEventListener('focusin', function (e) {
      var el = e.target;
      if (!el || el.tagName !== 'INPUT') return;
      if (el.type === 'number' || el.hasAttribute('data-numpad')) {
        showNumPadFor(el);
      } else if (!el.closest('#virtual-num-pad')) {
        hideNumPad();
      }
    });

    // =========================================================================
    // 19. CENTRALIZED DOCUMENT EVENT DELEGATION (CLICK, SUBMIT, INPUT, CHANGE)
    // =========================================================================
    document.addEventListener('click', function (e) {
      // Virtual Numeric Keypad Button Handlers
      var numKey = e.target.closest('.num-key');
      if (numKey) {
        e.preventDefault();
        if (!activeNumberInput || !document.body.contains(activeNumberInput)) return;
        var val = numKey.getAttribute('data-val');
        var cur = String(activeNumberInput.value || '');
        if (val === '.' && cur.indexOf('.') !== -1) return;
        activeNumberInput.value = (val === '.' && cur === '') ? '0.' : (cur + val);
        activeNumberInput.dispatchEvent(new Event('input', { bubbles: true }));
        activeNumberInput.dispatchEvent(new Event('change', { bubbles: true }));
        return;
      }
      if (e.target.closest('#num-pad-back')) {
        e.preventDefault();
        if (!activeNumberInput || !document.body.contains(activeNumberInput)) return;
        activeNumberInput.value = String(activeNumberInput.value || '').slice(0, -1);
        activeNumberInput.dispatchEvent(new Event('input', { bubbles: true }));
        activeNumberInput.dispatchEvent(new Event('change', { bubbles: true }));
        return;
      }
      if (e.target.closest('#num-pad-clear')) {
        e.preventDefault();
        if (!activeNumberInput || !document.body.contains(activeNumberInput)) return;
        activeNumberInput.value = '';
        activeNumberInput.dispatchEvent(new Event('input', { bubbles: true }));
        activeNumberInput.dispatchEvent(new Event('change', { bubbles: true }));
        return;
      }
      if (e.target.closest('#num-pad-close') || e.target.closest('#num-pad-done')) {
        e.preventDefault();
        hideNumPad();
        return;
      }

      // Close keypad if user taps outside keypad and outside numeric input
      if (activeNumberInput && !e.target.closest('#virtual-num-pad') && e.target !== activeNumberInput) {
        hideNumPad();
      }

      var navEl = e.target.closest('[data-nav]');
      if (navEl) {
        e.preventDefault();
        window.navigateTo(navEl.getAttribute('data-nav'));
        return;
      }

      var actEl = e.target.closest('[data-action]');
      if (!actEl) return;
      var act = actEl.getAttribute('data-action');
      var id = actEl.getAttribute('data-id');

      if (act === 'toggle-sidebar') { window.toggleSidebar(); return; }
      if (act === 'logout') { window.logoutUser(); return; }

      // POS Actions
      if (act === 'pos-tab') { posTab = actEl.getAttribute('data-tab'); renderActiveModule(); return; }
      if (act === 'pos-cat') { posCategory = id; renderActiveModule(); return; }
      if (act === 'pos-pay') { posPayMethod = actEl.getAttribute('data-pay'); renderActiveModule(); return; }
      if (act === 'cart-clear') { posCart = []; renderActiveModule(); return; }
      if (act === 'cart-add') {
        var tipo = actEl.getAttribute('data-tipo');
        if (tipo === 'servicio') {
          var s = state.services.find(function (x) { return x.id === id; });
          if (!s) return;
          var exS = posCart.find(function (x) { return x.tipo === 'servicio' && x.id === id; });
          if (exS) exS.cantidad++;
          else posCart.push({ tipo: 'servicio', id: s.id, nombre: s.nombre, precio: Number(s.precio) || 0, cantidad: 1 });
        } else {
          var p = state.products.find(function (x) { return x.id === id; });
          if (!p || p.stock <= 0) return;
          var exP = posCart.find(function (x) { return x.tipo === 'producto' && x.id === id; });
          if (exP) {
            if (exP.cantidad >= p.stock) { toast('Stock máximo alcanzado.', 'amber'); return; }
            exP.cantidad++;
          } else {
            posCart.push({ tipo: 'producto', id: p.id, nombre: p.nombre, precio: Number(p.precio) || 0, cantidad: 1 });
          }
        }
        renderActiveModule();
        return;
      }
      if (act === 'cart-qty') {
        var idx = parseInt(actEl.getAttribute('data-idx'), 10);
        var delta = parseInt(actEl.getAttribute('data-delta'), 10);
        var item = posCart[idx];
        if (!item) return;
        if (delta > 0 && item.tipo === 'producto') {
          var prod = state.products.find(function (x) { return x.id === item.id; });
          if (prod && item.cantidad + delta > prod.stock) { toast('No hay más stock disponible.', 'amber'); return; }
        }
        item.cantidad += delta;
        if (item.cantidad <= 0) posCart.splice(idx, 1);
        renderActiveModule();
        return;
      }
      if (act === 'cart-del') {
        posCart.splice(parseInt(actEl.getAttribute('data-idx'), 10), 1);
        renderActiveModule();
        return;
      }
      if (act === 'pos-checkout') {
        if (posCart.length === 0) { toast('Agrega al menos un servicio o producto.', 'amber'); return; }
        hideNumPad();
        var bSel = document.getElementById('pos-barber');
        var bObj = state.barbers.find(function (b) { return b.id === (bSel ? bSel.value : posBarberId); });
        var cWalk = (document.getElementById('pos-client-txt') ? document.getElementById('pos-client-txt').value.trim() : '');
        var cSel = (document.getElementById('pos-client-sel') ? document.getElementById('pos-client-sel').value : '');
        var clientName = cWalk || cSel || 'Cliente de paso';
        var totalSale = posCart.reduce(function (sum, it) { return sum + (it.precio * it.cantidad); }, 0);

        posCart.forEach(function (it) {
          if (it.tipo === 'producto') {
            var pr = state.products.find(function (x) { return x.id === it.id; });
            if (pr) pr.stock = Math.max(0, pr.stock - it.cantidad);
          }
        });

        var now = new Date();
        var hora = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        var saleId = 'GL-' + (1001 + state.sales.length);
        state.sales.unshift({
          id: saleId,
          fecha: TODAY,
          hora: hora,
          barberoId: bObj ? bObj.id : '',
          barberoNombre: bObj ? bObj.nombre : 'Barbero',
          clienteNombre: clientName,
          metodoPago: posPayMethod,
          items: JSON.parse(JSON.stringify(posCart)),
          total: totalSale
        });
        posCart = [];
        posClientWalkin = '';
        posCashReceived = '';
        saveState();
        renderActiveModule();
        toast('Venta cobrada: ' + rd(totalSale), 'green');
        printSaleDirect(saleId);
        return;
      }

      // Clientes Actions
      if (act === 'client-edit') { editClientId = id; renderActiveModule(); return; }
      if (act === 'client-cancel') { editClientId = null; renderActiveModule(); return; }
      if (act === 'client-del') { state.clients = state.clients.filter(function (c) { return c.id !== id; }); saveState(); renderActiveModule(); return; }

      // Productos & Categorías Actions
      if (act === 'cat-edit') { editCatId = id; renderActiveModule(); return; }
      if (act === 'cat-cancel') { editCatId = null; renderActiveModule(); return; }
      if (act === 'cat-del') { state.productCategories = state.productCategories.filter(function (c) { return c.id !== id; }); saveState(); renderActiveModule(); return; }
      if (act === 'prod-edit') { editProdId = id; tempProdImg = ''; renderActiveModule(); return; }
      if (act === 'prod-cancel') { editProdId = null; tempProdImg = ''; renderActiveModule(); return; }
      if (act === 'prod-clear-img') {
        tempProdImg = '';
        if (editProdId) { var ep = state.products.find(function (x) { return x.id === editProdId; }); if (ep) ep.imagen = ''; }
        renderActiveModule();
        return;
      }
      if (act === 'prod-del') { state.products = state.products.filter(function (p) { return p.id !== id; }); saveState(); renderActiveModule(); return; }
      if (act === 'prod-stock') {
        var pr = state.products.find(function (p) { return p.id === id; });
        var dlt = parseInt(actEl.getAttribute('data-delta'), 10);
        if (pr) { pr.stock = Math.max(0, pr.stock + dlt); saveState(); renderActiveModule(); toast('Stock actualizado: ' + pr.stock + ' uds', 'green'); }
        return;
      }
      if (act === 'prod-batch-toggle') { batchProdId = batchProdId === id ? null : id; renderActiveModule(); return; }
      if (act === 'prod-batch-apply') {
        var prB = state.products.find(function (p) { return p.id === id; });
        var inpB = document.getElementById('batch-inp-' + id);
        var valB = inpB ? parseInt(inpB.value, 10) : 0;
        if (prB && !isNaN(valB)) { prB.stock = Math.max(0, prB.stock + valB); batchProdId = null; saveState(); renderActiveModule(); toast('Stock actualizado.', 'green'); }
        return;
      }

      // Servicios Actions
      if (act === 'serv-edit') { editServId = id; tempServImg = ''; renderActiveModule(); return; }
      if (act === 'serv-cancel') { editServId = null; tempServImg = ''; renderActiveModule(); return; }
      if (act === 'serv-clear-img') {
        tempServImg = '';
        if (editServId) { var es = state.services.find(function (x) { return x.id === editServId; }); if (es) es.imagen = ''; }
        renderActiveModule();
        return;
      }
      if (act === 'serv-del') { state.services = state.services.filter(function (s) { return s.id !== id; }); saveState(); renderActiveModule(); return; }

      // Reportes Actions
      if (act === 'print-sale') { printSaleDirect(id); return; }
      if (act === 'rep-csv') {
        var rows = state.sales.filter(function (s) {
          return (!repFrom || s.fecha >= repFrom) && (!repTo || s.fecha <= repTo) && (repPay === 'Todos' || s.metodoPago === repPay);
        });
        var csv = 'Ticket,Fecha,Hora,Cliente,Barbero,Pago,Total
' + rows.map(function (s) {
          return [s.id, s.fecha, s.hora, '"' + s.clienteNombre + '"', '"' + s.barberoNombre + '"', s.metodoPago, s.total].join(',');
        }).join('
');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = 'Reportes_GoldLabel_' + repFrom + '_' + repTo + '.csv';
        a.click();
        return;
      }

      // Barberos & Adelantos Actions
      if (act === 'barb-edit') { editBarberId = id; renderActiveModule(); return; }
      if (act === 'barb-cancel') { editBarberId = null; renderActiveModule(); return; }

      if (act === 'print-advance') { printAdvanceDirect(id); return; }

      if (act === 'fb-force-push') {

      }
      if (act === 'fb-force-pull') {
        if (!db) { toast('Firebase no inicializado.', 'red'); return; }
        db.collection("gold_label_barber").doc("main_data").get().then(function (doc) {
          if (doc.exists && doc.data().payloadJson) {

          cedula: document.getElementById('br-ced').value.trim(),
          telefono: document.getElementById('br-tel').value.trim(),
          comision: parseFloat(document.getElementById('br-com').value) || 50,
          activo: document.getElementById('br-act').value === '1'
        };
        if (editBarberId) {
          var ib = state.barbers.findIndex(function (b) { return b.id === editBarberId; });
          if (ib >= 0) state.barbers[ib] = Object.assign({}, state.barbers[ib], objB);
          editBarberId = null;
        } else {
          state.barbers.push(Object.assign({ id: 'b' + Date.now() }, objB));
        }
        saveState();
        renderActiveModule();
        toast('Barbero guardado.', 'green');
        return;
      }

      if (type === 'advance') {
        var bId = document.getElementById('ad-barb').value;
        var bObj = state.barbers.find(function (b) { return b.id === bId; });
        var monto = parseFloat(document.getElementById('ad-monto').value) || 0;
        var fecha = document.getElementById('ad-fecha').value || TODAY;
        var motivo = document.getElementById('ad-motivo').value.trim();
        if (monto <= 0) return;
        var now = new Date();
        var hora = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        var advId = 'AD-' + (101 + state.advances.length);
        state.advances.unshift({
          id: advId,
          fecha: fecha,
          hora: hora,
          barberoId: bId,
          barberoNombre: bObj ? bObj.nombre : 'Barbero',
          barberoCedula: bObj ? bObj.cedula : '',
          monto: monto,
          motivo: motivo
        });
        saveState();
        renderActiveModule();
        toast('Adelanto registrado.', 'green');
        printAdvanceDirect(advId);
        return;
      }

      if (type === 'staff') {
        var objSt = {
          nombre: document.getElementById('st-nom').value.trim(),
          cedula: document.getElementById('st-ced').value.trim(),
          cargo: document.getElementById('st-car').value.trim(),
          telefono: document.getElementById('st-tel').value.trim(),
          sueldo: parseFloat(document.getElementById('st-sue').value) || 0,
          horario: document.getElementById('st-hor').value.trim(),
          activo: document.getElementById('st-act').value === '1',
          fechaIngreso: TODAY
        };
        if (editStaffId) {
          var ist = state.staff.findIndex(function (s) { return s.id === editStaffId; });
          if (ist >= 0) state.staff[ist] = Object.assign({}, state.staff[ist], objSt);
          editStaffId = null;
        } else {
          state.staff.push(Object.assign({ id: 'st' + Date.now() }, objSt));
        }
        saveState();
        renderActiveModule();
        toast('Personal guardado.', 'green');
        return;
      }

      if (type === 'ticket-cfg') {
        state.receipt.nombreNegocio = document.getElementById('cfg-nom').value.trim();
        state.receipt.eslogan = document.getElementById('cfg-esl').value.trim();
        state.receipt.direccion = document.getElementById('cfg-dir').value.trim();
        state.receipt.telefono = document.getElementById('cfg-tel').value.trim();
        state.receipt.horario = document.getElementById('cfg-hor').value.trim();
        state.receipt.anchoPapel = document.getElementById('cfg-anc').value;
        state.receipt.fontSize = document.getElementById('cfg-fs').value;
        state.receipt.mensajeFinal = document.getElementById('cfg-msg1').value.trim();
        state.receipt.notaInferior = document.getElementById('cfg-msg2').value.trim();
        state.receipt.mostrarLogo = document.getElementById('cfg-show-logo').checked;
        state.receipt.mostrarHorario = document.getElementById('cfg-show-hor').checked;
        saveState();
        renderActiveModule();
        toast('Configuración de ticket guardada.', 'green');
        return;
      }

      if (type === 'user') {
        var mods = ['ventas'];
        document.querySelectorAll('input[name="us-mod"]:checked').forEach(function (chk) {
          if (mods.indexOf(chk.value) === -1) mods.push(chk.value);
        });
        var objU = {
          nombre: document.getElementById('us-nom').value.trim(),
          username: document.getElementById('us-usr').value.trim(),
          password: document.getElementById('us-pwd').value.trim(),
          rol: document.getElementById('us-rol').value,
          modulos: mods
        };
        if (editUserId) {
          var iu = state.users.findIndex(function (u) { return u.id === editUserId; });
          if (iu >= 0) state.users[iu] = Object.assign({}, state.users[iu], objU);
          editUserId = null;
        } else {
          state.users.push(Object.assign({ id: 'u' + Date.now() }, objU));
        }
        saveState();
        renderActiveModule();
        toast('Usuario guardado.', 'green');
        return;
      }
    });

    document.addEventListener('input', function (e) {
      var id = e.target.id;
      if (id === 'pos-search-inp') { posSearch = e.target.value; renderActiveModule(); var el = document.getElementById('pos-search-inp'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
      if (id === 'pos-client-txt') { posClientWalkin = e.target.value; return; }
      if (id === 'pos-cash-inp') {
        posCashReceived = e.target.value;
        var total = posCart.reduce(function (sum, it) { return sum + (it.precio * it.cantidad); }, 0);
        var ch = (parseFloat(posCashReceived) || 0) - total;
        var lbl = document.getElementById('pos-change-lbl');
        if (lbl) {
          lbl.textContent = (parseFloat(posCashReceived) || 0) > 0 ? rd(Math.max(0, ch)) : 'RD$ 0.00';
          lbl.className = 'text-sm ' + (ch >= 0 ? 'text-green' : 'text-amber');
        }
        return;
      }
      if (id === 'cl-search-inp') { clientSearch = e.target.value; renderActiveModule(); var clEl = document.getElementById('cl-search-inp'); if (clEl) { clEl.focus(); clEl.setSelectionRange(clEl.value.length, clEl.value.length); } return; }
      if (id && id.indexOf('cfg-') === 0) {
        if (id === 'cfg-nom') state.receipt.nombreNegocio = e.target.value;
        if (id === 'cfg-esl') state.receipt.eslogan = e.target.value;
        if (id === 'cfg-dir') state.receipt.direccion = e.target.value;
        if (id === 'cfg-tel') state.receipt.telefono = e.target.value;
        if (id === 'cfg-hor') state.receipt.horario = e.target.value;
        if (id === 'cfg-msg1') state.receipt.mensajeFinal = e.target.value;
        if (id === 'cfg-msg2') state.receipt.notaInferior = e.target.value;
        updateCfgLivePreview();
      }
    });

    document.addEventListener('change', function (e) {
      var id = e.target.id;
      if (id === 'pos-barber') { posBarberId = e.target.value; return; }
      if (id === 'pos-client-sel') { posClientSel = e.target.value; return; }
      if (id === 'dash-date-inp') { dashDate = e.target.value || TODAY; renderActiveModule(); return; }
      if (id === 'rep-from') { repFrom = e.target.value; renderActiveModule(); return; }
      if (id === 'rep-to') { repTo = e.target.value; renderActiveModule(); return; }
      if (id === 'rep-pay') { repPay = e.target.value; renderActiveModule(); return; }
      if (id === 'brep-date') { barbRepDate = e.target.value || TODAY; renderActiveModule(); return; }
      if (id === 'cie-date') { cierreDate = e.target.value || TODAY; renderActiveModule(); return; }
      if (id === 'cie-fondo') { fondoInicial = parseFloat(e.target.value) || 0; renderActiveModule(); return; }
      if (id === 'cfg-anc') { state.receipt.anchoPapel = e.target.value; updateCfgLivePreview(); return; }
      if (id === 'cfg-fs') { state.receipt.fontSize = e.target.value; updateCfgLivePreview(); return; }
      if (id === 'cfg-show-logo') { state.receipt.mostrarLogo = e.target.checked; updateCfgLivePreview(); return; }
      if (id === 'cfg-show-hor') { state.receipt.mostrarHorario = e.target.checked; updateCfgLivePreview(); return; }

      if (id === 'pr-file') {
        compressImageFile(e.target, function (dataUrl) {
          tempProdImg = dataUrl;
          renderActiveModule();
          toast('Imagen de producto cargada.', 'green');
        });
        return;
      }
      if (id === 'sv-file') {
        compressImageFile(e.target, function (dataUrl) {
          tempServImg = dataUrl;
          renderActiveModule();
          toast('Imagen de servicio cargada.', 'green');
        });
        return;
      }
      if (id === 'cfg-logo-file') {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var c = document.createElement('canvas');
            c.width = 180;
            c.height = 180;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 180, 180);
            ctx.drawImage(img, 0, 0, 180, 180);
            var imgData = ctx.getImageData(0, 0, 180, 180);
            var d = imgData.data;
            for (var i = 0; i < d.length; i += 4) {
              var g = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
              var bw = g < 145 ? 0 : 255;
              d[i] = d[i + 1] = d[i + 2] = bw;
            }
            ctx.putImageData(imgData, 0, 0);
            state.receipt.customLogo = c.toDataURL('image/png');
            saveState();
            renderActiveModule();
            toast('Logotipo térmico actualizado.', 'green');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(f);
        return;
      }
      if (id === 'json-import-file') {
        var jf = e.target.files && e.target.files[0];
        if (!jf) return;
        var jr = new FileReader();
        jr.onload = function (ev) {
          try {
            var imported = JSON.parse(ev.target.result);
            state = Object.assign(defaultState(), imported);
            saveState();
            renderActiveModule();
            toast('Respaldo .JSON restaurado con éxito.', 'green');
          } catch (err) {
            toast('Archivo JSON inválido.', 'red');
          }
        };
        jr.readAsText(jf);
        return;
      }
    });

    // =========================================================================
    // 20. INITIALIZE APPLICATION IMMEDIATELY
    // =========================================================================
    document.getElementById('login-emblem').innerHTML = barberLogoSVG('login-lg', false);
    document.getElementById('sb-logo').innerHTML = barberLogoSVG('sb-lg', false);
    document.getElementById('today-pill').textContent = TODAY;

    var savedSessionId = safeGet(SESSION_KEY);
    if (savedSessionId) {
      var foundUser = state.users.find(function (u) { return u.id === savedSessionId; });
      if (foundUser) {
        currentUser = Object.assign({}, foundUser, {
          modulos: Array.from(new Set(['ventas'].concat(foundUser.modulos || [])))
        });
      }
    }

    syncShellVisibility();
    startRealtimeCloudSync();
  </script>
</body>
</html>
