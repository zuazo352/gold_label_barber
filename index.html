<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOLD LABEL BARBER (EST. 1963) — Sistema Integral POS &amp; Gestión</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='96' fill='%2308090c' stroke='%23d4af37' stroke-width='6'/%3E%3Ccircle cx='100' cy='100' r='84' fill='none' stroke='%23d4af37' stroke-width='2.5'/%3E%3Cpath d='M75 55 L125 135 M125 55 L75 135' stroke='%23f3d066' stroke-width='8' stroke-linecap='round'/%3E%3Crect x='88' y='105' width='24' height='55' rx='6' fill='%23ffffff' stroke='%23d4af37' stroke-width='3'/%3E%3Cpath d='M88 120 L112 110 M88 135 L112 125 M88 150 L112 140' stroke='%23B91C1C' stroke-width='6'/%3E%3C/svg%3E" />
  
  <!-- Firebase SDKs Compat (Cargados al inicio para garantizar disponibilidad) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #08090c;
      --surface: #111319;
      --surface-2: #181b24;
      --input: #0b0d12;
      --border: #262b38;
      --gold: #d4af37;
      --gold-hi: #f3d066;
      --gold-lo: #9c7b1c;
      --cream: #f5ebd6;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --dim: #6b7280;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --ticket-w: 80mm;
      --ticket-fs: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      overflow-x: hidden;
    }

    .serif { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.05em; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .hidden { display: none !important; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .flex-col { flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .flex-1 { flex: 1 1 0%; }
    .shrink-0 { flex-shrink: 0; }
    .min-w-0 { min-width: 0; }
    .w-full { width: 100%; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .p-2 { padding: 8px; }
    .p-3 { padding: 12px; }
    .p-4 { padding: 16px; }
    .pt-2 { padding-top: 8px; }
    .pt-3 { padding-top: 12px; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-base { font-size: 15px; }
    .text-lg { font-size: 18px; }
    .text-xl { font-size: 22px; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .uppercase { text-transform: uppercase; letter-spacing: 0.08em; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .text-gold { color: var(--gold); }
    .text-gold-hi { color: var(--gold-hi); }
    .text-muted { color: var(--muted); }
    .text-dim { color: var(--dim); }
    .text-green { color: var(--green); }
    .text-amber { color: var(--amber); }
    .text-red { color: var(--red); }

    /* =====================================================================
1. LOGIN SCREEN (Dark Glassmorphism - Clean)
       ===================================================================== */
    #login-view {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 22%, rgba(212, 175, 55, 0.14), transparent 55%),
        radial-gradient(circle at 80% 85%, rgba(212, 175, 55, 0.06), transparent 50%),
        #08090c;
    }
    .login-card {
      width: 100%;
      max-width: 410px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 28px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .login-emblem {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      box-shadow: 0 10px 28px rgba(212, 175, 55, 0.3);
    }
    .login-field {
      width: 100%;
      background: rgba(10, 12, 17, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-field::placeholder { color: rgba(255, 255, 255, 0.42); }
    .login-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.16); }
    .btn-cream-pill {
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #f5ebd6 0%, #e8d3a3 100%);
      color: #111318;
      font-weight: 800;
      font-size: 14.5px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(245, 235, 214, 0.2);
      transition: transform 0.12s, filter 0.15s;
    }
    .btn-cream-pill:hover { filter: brightness(1.05); }
    .btn-cream-pill:active { transform: scale(0.985); }

    /* =====================================================================
2. WORKSPACE SHELL & COLLAPSIBLE SIDEBAR WITH EDGE HANDLE TAB
       ===================================================================== */
    #app-shell {
      display: none;
      min-height: 100vh;
      width: 100%;
      position: relative;
    }
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 245px;
      background: #0c0e14;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 60;
      transform: translateX(0);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 16px 0 44px rgba(0, 0, 0, 0.78);
    }
    body.sidebar-collapsed #sidebar {
      transform: translateX(-100%);
      box-shadow: none;
    }
    #sidebar-edge-tab {
      position: absolute;
      top: 50%;
      right: -34px;
      transform: translateY(-50%);
      width: 34px;
      height: 76px;
      background: linear-gradient(180deg, #171b26 0%, #0c0e14 100%);
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-left: none;
      border-radius: 0 12px 12px 0;
      color: var(--gold-hi);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      box-shadow: 6px 0 20px rgba(0, 0, 0, 0.65);
      pointer-events: auto;
      z-index: 65;
      padding: 0;
    }
    #sidebar-edge-tab:hover {
      background: linear-gradient(135deg, var(--gold-hi), var(--gold));
      color: #08090c;
    }
    #workspace-main {
      flex: 1 1 0%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      margin-left: 245px;
      transition: margin-left 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.sidebar-collapsed #workspace-main {
      margin-left: 0;
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: #d1d5db;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-btn:hover { background: var(--surface-2); color: var(--gold-hi); }
    .nav-btn.active {
      background: linear-gradient(135deg, var(--gold-hi), var(--gold));
      color: #08090c;
      font-weight: 800;
    }

    #topbar {
      background: #0c0e14;
      border-bottom: 1px solid var(--border);
      padding: 11px 16px 11px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      #workspace-main { margin-left: 0 !important; }
      #topbar { padding-left: 28px; }
    }

    /* =====================================================================
3. CARDS, GRIDS, FORMS, BUTTONS & TABLES
       ===================================================================== */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .card-gold {
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .subcard { background: var(--input); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-pos { grid-template-columns: 1.55fr 1fr; }
    .grid-split { grid-template-columns: 365px 1fr; }
    .grid-split-wide { grid-template-columns: 445px 1fr; }
    .grid-catalog { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    body.sidebar-collapsed .grid-catalog { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    @media (max-width: 1120px) {
      .grid-pos, .grid-split, .grid-split-wide { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .grid-catalog { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    }

    label.lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input, select, textarea {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }
    input[type="checkbox"] { width: auto; accent-color: var(--gold); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
    .btn-xs { padding: 4px 8px; font-size: 11px; border-radius: 7px; }
    .btn-gold { background: linear-gradient(135deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%); color: #08090c; }
    .btn-dark { background: var(--surface-2); border-color: var(--border); color: var(--text); }
    .btn-dark:hover { border-color: var(--gold); color: var(--gold-hi); }
    .btn-out-gold { background: rgba(212, 175, 55, 0.11); border-color: rgba(212, 175, 55, 0.45); color: var(--gold); }
    .btn-out-gold:hover { background: var(--gold); color: #08090c; }
    .btn-red { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.42); color: #fca5a5; }
    .btn-red:hover { background: var(--red); color: #fff; }
    .btn-green { background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.42); color: #6ee7b7; }
    .btn-green:hover { background: var(--green); color: #052e16; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .b-gold { background: rgba(212, 175, 55, 0.16); color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.36); }
    .b-green { background: rgba(16, 185, 129, 0.16); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.36); }
    .b-amber { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.36); }
    .b-red { background: rgba(239, 68, 68, 0.16); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.36); }
    .b-dim { background: #1e2433; color: #cbd5e1; }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      padding: 9px;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 10px 9px; border-bottom: 1px solid rgba(38, 43, 56, 0.78); vertical-align: middle; }

    .pos-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
    }
    .pos-card:hover:not(:disabled) { border-color: var(--gold); background: var(--surface-2); }
    .pos-card:disabled { opacity: 0.45; cursor: not-allowed; }
    .pos-thumb { width: 100%; height: 96px; object-fit: cover; border-radius: 8px; background: #080a0e; border: 1px solid var(--border); }
    .pos-thumb-svg {
      width: 100%;
      height: 96px;
      border-radius: 8px;
      background: linear-gradient(145deg, #0b0d13, #151924);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }

    /* =====================================================================
4. TOAST NOTIFICATIONS & DIRECT THERMAL PRINT (@media print)
       ===================================================================== */
    #toast-box {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      background: #141822;
      border: 1px solid var(--gold);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.78);
    }

    #print-area { display: none; }

    @media print {
      @page { margin: 0; }
      body { background: #ffffff !important; color: #000000 !important; }
      #login-view, #app-shell, #toast-box { display: none !important; }
      #print-area {
        display: block !important;
        width: var(--ticket-w, 80mm) !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 4mm !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-family: "Courier New", Courier, monospace !important;
        font-size: var(--ticket-fs, 12px) !important;
        line-height: 1.35 !important;
      }
      #print-area * { color: #000000 !important; }
    }
  </style>
</head>
<body>

  <!-- =====================================================================
1. LOGIN SCREEN (Dark Glassmorphism - Clean, No Demo Hints/Buttons)
       ===================================================================== -->
  <section id="login-view">
    <div class="login-card">
      <div id="login-emblem" class="login-emblem"></div>
      <h1 class="serif text-xl font-extrabold text-center" style="color:#f5ebd6;">GOLD LABEL BARBER</h1>
      <p class="text-xs uppercase text-center text-gold mt-1 mb-4" style="letter-spacing:0.2em;">EST. 1963</p>

      <form data-form="login" class="flex flex-col gap-3 mt-4">
        <div>
          <label class="block text-xs font-bold mb-1" style="color:rgba(255,255,255,0.85);">Usuario</label>
          <input type="text" id="login-user" class="login-field" placeholder="Ingresa tu usuario" autocomplete="username" required />
        </div>
        <div>
          <label class="block text-xs font-bold mb-1" style="color:rgba(255,255,255,0.85);">Contraseña</label>
          <input type="password" id="login-pass" class="login-field" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div id="login-err" class="text-xs text-red text-center hidden">Usuario o contraseña incorrectos.</div>
        <button type="submit" class="btn-cream-pill mt-2">Ingresar al Sistema</button>
      </form>
    </div>
  </section>

  <!-- =====================================================================
2. MAIN WORKSPACE SHELL (Collapsible Sidebar with Left Edge Tab)
       ===================================================================== -->
  <div id="app-shell">
    <aside id="sidebar">
      <button type="button" data-action="toggle-sidebar" id="sidebar-edge-tab" title="Ocultar / Mostrar Menú">
        <span id="edge-tab-arrow" style="font-size:13px;font-weight:900;line-height:1;">&#9664;</span>
        <span style="font-size:9px;font-weight:800;writing-mode:vertical-rl;letter-spacing:0.12em;text-transform:uppercase;">Menú</span>
      </button>

      <div class="p-3 flex items-center gap-2" style="border-bottom: 1px solid var(--border);">
        <div id="sb-logo" style="width:44px;height:44px;flex-shrink:0;"></div>
        <div class="min-w-0">
          <div class="serif text-xs font-extrabold text-gold truncate">GOLD LABEL BARBER</div>
          <div class="text-xs text-muted truncate">EST. 1963 • RD$</div>
        </div>
      </div>

      <div class="p-3" style="border-bottom: 1px solid var(--border);">
        <div class="subcard flex items-center gap-2">
          <div id="sb-avatar" class="badge b-gold font-extrabold" style="width:32px;height:32px;justify-content:center;border-radius:50%;">AG</div>
          <div class="min-w-0 flex-1">
            <div id="sb-uname" class="text-xs font-bold truncate">Administrador General</div>
            <div id="sb-urole" class="text-xs text-gold truncate">Administrador</div>
          </div>
        </div>
      </div>

      <nav id="sb-nav" class="p-3 flex flex-col gap-1 flex-1" style="overflow-y:auto;"></nav>

      <div class="p-3" style="border-top: 1px solid var(--border);">
        <button type="button" data-action="logout" class="btn btn-red btn-sm w-full">Cerrar Sesión</button>
      </div>
    </aside>

    <div id="workspace-main">
      <header id="topbar">
        <div class="flex items-center gap-3 min-w-0">
          <button type="button" data-action="toggle-sidebar" id="btn-toggle-sb" class="btn btn-dark btn-sm">&#9776; Ocultar Menú</button>
          <div class="min-w-0">
            <h2 id="mod-title" class="text-base font-extrabold truncate">Ventas (POS)</h2>
            <p id="mod-sub" class="text-xs text-muted truncate">Punto de Venta táctil y ticket térmico 80mm</p>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <span id="cloud-status-pill" class="badge b-dim">&#9729; Modo Local</span>
          <span id="today-pill" class="badge b-gold"></span>
          <button type="button" data-action="logout" class="btn btn-red btn-sm">Cerrar Sesión</button>
        </div>
      </header>

      <main id="main-content" class="p-4 flex-1"></main>
    </div>
  </div>

  <!-- Direct Thermal Print Target (Hidden on screen, visible only in @media print) -->
  <div id="print-area"></div>
  <div id="toast-box"></div>

  <script>
    // =========================================================================
    // 1. SAFE PERSISTENCE & CONSTANTS
    // =========================================================================
    var STORAGE_KEY = 'glb_pos_v10';
    var SESSION_KEY = 'glb_pos_v10_session';
    var memoryFallback = {};

    function safeGet(k) {
      try { return localStorage.getItem(k); } catch (e) { return memoryFallback[k] || null; }
    }
    function safeSet(k, v) {
      try { localStorage.setItem(k, v); } catch (e) { memoryFallback[k] = v; }
    }
    function safeDel(k) {
      try { localStorage.removeItem(k); } catch (e) { delete memoryFallback[k]; }
    }

    function todayISO() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    var TODAY = todayISO();

    function rd(n) {
      return 'RD$ ' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function barberLogoSVG(uid, bw) {
      var bg = bw ? '#ffffff' : '#08090c';
      var fg = bw ? '#000000' : '#f3d066';
      var hi = bw ? '#000000' : '#ffffff';

    function compressImageFile(fileInput, callback) {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var max = 240;
          var w = img.width;
          var h = img.height;
          if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
          else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }
